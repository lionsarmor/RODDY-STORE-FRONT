<meta name="description" content="RODDY: physical games, computers, electronic toys and programmable machines. Play it. Open it. Program it. Keep it.">
<link id="roddy-favicon" rel="icon" type="image/svg+xml" href="./img/logos/RODDY_SVG_BRAND_PACK/badge/filled/roddy_badge_classic_cream_red_filled.svg">
<script>
  // Restore the saved theme before first paint so there's no flash of the
  // wrong palette while Vue/Pinia are still booting.
  (function () {
    try {
      var t = localStorage.getItem("roddy:theme");
      if (t) document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  })();
</script>
